export default async function handler(req, res) {
  if (!process.env.DATABASE_URL) {
    return res.status(200).json({ error: 'DATABASE_URL not set' });
  }
  const sql = neon(process.env.DATABASE_URL);
  try {
    const { id } = req.query;
    if (req.method === 'GET') {
      if (id) {
        const rows = await sql\`SELECT data FROM musco_store WHERE id = \${id}\`;
        return res.status(200).json(rows[0]?.data || null);
      } else {
        const rows = await sql\`SELECT id, data FROM musco_store\`;
        return res.status(200).json(rows);
      }
    }
    if (req.method === 'POST') {
      const { id, data } = req.body;
      await sql\`INSERT INTO musco_store (id, data) VALUES (\${id}, \${data}) ON CONFLICT (id) DO UPDATE SET data = EXCLUDED.data\`;
