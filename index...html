 const [data,setData]=useState(EMPTY); const [cloud,setCloud]=useState('LOADING');

 const adjustCredit=async m=>{const amount=Number(prompt('Adjustment amount. Use negative number to deduct.','0'));if(!amount)return;const note=prompt('Reason','Manual Adjustment')||'Manual Adjustment';const before=Number(m.credit||0),after=before+amount;if(after<0){alert('Credit cannot be below RM0');return;}const entry={id:uid('cr'),customerId:m.id,customerName:m.name,date:new Date().toISOString(),type:'ADJUST',amount,before,after,note};await save({...data,members:customers.map(x=>x.id===m.id?{...x,credit:after}:x),creditHistory:[entry,...data.creditHistory]});};

 const addItem=()=>{const p=data.products[0];if(!p){alert('请先建立 Product');return;}setDraft(d=>({...d,items:[...d.items,{lineId:uid('line'),productId:p.id,pid:p.productId,productName:p.name,qty:1,price:Number(p.memberPrice||p.regularPrice||0)}]}));};

 const completeManualOrder=async()=>{if(!draft.name.trim()||!draft.phone.trim()){alert('Customer Name 和 Phone 必填');return;}if(!draft.items.length){alert('请加入至少一个 Product');return;}for(const i of draft.items){const p=data.products.find(x=>x.id===i.productId);if(!p){alert('Product not found');return;}if(Number(i.qty||0)>Number(p.stock||0)){alert(`${p.name} 库存不足。目前 ${p.stock||0}`);return;}}
  let members=[...customers],customerId=draft.customerId,customer=customers.find(x=>x.id===customerId);if(!customer&&draft.saveCustomer){customer={id:uid('c'),name:draft.name.trim(),phone:draft.phone.trim(),address:draft.address.trim(),email:'',businessName:'',credit:0,createdAt:new Date().toISOString()};customerId=customer.id;members=[customer,...members];}
  let creditBefore=Number(customer?.credit||0),creditUsed=0,creditAfter=creditBefore,creditHistory=[...data.creditHistory];if(draft.paymentMethod==='Member Credit'){if(!customer){alert('Member Credit 只能选择 Existing Customer 或先保存为 Customer');return;}if(creditBefore<draftTotal){alert(`Credit 不足。目前 ${money(creditBefore)}`);return;}creditUsed=draftTotal;creditAfter=creditBefore-creditUsed;members=members.map(x=>x.id===customer.id?{...x,credit:creditAfter}:x);creditHistory=[{id:uid('cr'),customerId:customer.id,customerName:draft.name,date:new Date().toISOString(),type:'USE',amount:-creditUsed,before:creditBefore,after:creditAfter,note:'Order payment'},...creditHistory];}
  const orderNo=nextOrderNo(),invoiceNo=nextInvoiceNo();const items=draft.items.map(i=>({...i,total:Number(i.qty)*Number(i.price)}));const products=data.products.map(p=>{const i=items.find(x=>x.productId===p.id);return i?{...p,stock:Number(p.stock||0)-Number(i.qty||0)}:p;});const movements=items.map(i=>({id:uid('st'),date:new Date().toISOString(),type:'OUT',productId:i.productId,pid:i.pid,productName:i.productName,qty:-Number(i.qty),reference:invoiceNo,customerName:draft.name,note:'Order'}));const order={orderNo,invoiceNo,date:today(),invoiceDate:draft.invoiceDate||today(),memberId:customerId||null,memberName:draft.name.trim(),contact:draft.phone.trim(),address:draft.address.trim(),items,subtotal:draftTotal,totalAmount:draftTotal,paymentMethod:draft.paymentMethod,status:'Processing',invoiceGenerated:true,trackingNo:'',salesPerson:draft.salesPerson||data.settings.salesPerson||'Mus&Co.',remarks:draft.remarks||'',creditBefore,creditUsed,creditBalanceAfter:creditAfter,createdBy:'ADMIN V2'};
  await save({...data,members,products,orders:[order,...data.orders],creditHistory,stockMovements:[...movements,...data.stockMovements]});setInvoice(order);setDraft(emptyOrder());setTab('orders');};

 const saveTracking=async(o,tn)=>{await save({...data,orders:data.orders.map(x=>x.orderNo===o.orderNo?{...x,trackingNo:tn,status:tn?'Shipped':(x.invoiceGenerated?'Processing':'Draft')}:x)});};

 const stockIn=async p=>{const qty=Number(prompt(`Stock IN — ${p.name}\nQuantity`,'0'));if(!qty||qty<=0)return;const note=prompt('Supplier / Note','Supplier Restock')||'Supplier Restock';const movement={id:uid('st'),date:new Date().toISOString(),type:'IN',productId:p.id,pid:p.productId,productName:p.name,qty,reference:'',customerName:'',note};await save({...data,products:data.products.map(x=>x.id===p.id?{...x,stock:Number(x.stock||0)+qty}:x),stockMovements:[movement,...data.stockMovements]});};

get.value})} className="w-full h-11 px-3 rounded-xl border"><option>Bank Transfer</option><option>TNG / Online Payment</option><option>Cash</option><option>Member Credit</option></select></label><Field type="date" label="Invoice Date" value={draft.invoiceDate} onChange={e=>setDraft({...draft,invoiceDate:e.target.value})}/><Field label="Sales Person" value={draft.salesPerson} onChange={e=>setDraft({...draft,salesPerson:e.target.value})}/><TextArea label="Remarks" value={draft.remarks} onChange={e=>setDraft({...draft,remarks:e.target.value})}/></div></div></div><div className="bg-white rounded-[22px] border p-5 h-fit"><div className="flex justify-between items-center"><div className="font-semibold">2. Products</div><button onClick={addItem} className="px-4 py-2 rounded-full bg-black text-white text-[10px]">+ ADD PRODUCT</button></div><div className="space-y-3 mt-4">{draft.items.map(i=><div key={i.lineId} className="p-3 rounded-2xl bg-[#f7f5f1] border"><select value={i.productId} onChange={e=>setItemProduct(i.lineId,e.target.value)} className="w-full h-10 px-3 rounded-xl border bg-white">{data.products.map(p=><option key={p.id} value={p.id}>{p.productId} · {p.name} · Stock {p.stock}</option>)}</select><div className="grid grid-cols-[80px_1fr_auto] gap-2 mt-2"><input type="number" min="1" value={i.qty} onChange={e=>setDraft({...draft,items:draft.items.map(x=>x.lineId===i.lineId?{...x,qty:Number(e.target.value)}:x)})} className="h-10 px-3 rounded-xl border"/><input type="number" step="0.01" value={i.price} onChange={e=>setDraft({...draft,items:draft.items.map(x=>x.lineId===i.lineId?{...x,price:Number(e.target.value)}:x)})} className="h-10 px-3 rounded-xl border"/><button onClick={()=>setDraft({...draft,items:draft.items.filter(x=>x.lineId!==i.lineId)})} className="h-10 px-3 rounded-xl bg-red-50 text-red-600 text-[10px]">REMOVE</button></div><div className="text-right text-[11px] mt-2">Line Total <b>{money(Number(i.qty)*Number(i.price))}</b></div></div>)}{!draft.items.length&&<Empty text="Add products to this order"/>}</div><div className="border-t mt-5 pt-5"><div className="flex justify-between text-[13px]"><span>Subtotal</span><b>{money(draftTotal)}</b></div><div className="grid sm:grid-cols-2 gap-2 mt-5"><button onClick={saveDraftOrder} className="h-12 rounded-xl border text-[11px]">SAVE DRAFT</button><button onClick={completeManualOrder} className="h-12 rounded-xl bg-black text-white text-[11px] font-semibold">COMPLETE + GENERATE INVOICE</button></div><div className="text-[10px] opacity-45 mt-3 leading-5">Stock and Credit are deducted only when you complete the order.</div></div></div></div></div>}
    {tab==='orders'&&<div><div className="flex flex-wrap gap-3 justify-between items-end mb-5"><div><div className="text-[9px] tracking-[.2em] opacity-40">SALES RECORDS</div><h1 className="serif text-3xl">Orders</h1></div><input value={orderSearch} onChange={e=>setOrderSearch(e.target.value)} placeholder="Search invoice / customer / phone..." className="h-11 px-4 rounded-xl border w-full sm:w-[330px]"/></div><div className="space-y-3">{filteredOrders.map(o=><OrderCard key={o.orderNo} o={o} onInvoice={()=>setInvoice(o)} onComplete={()=>completeExistingDraft(o)} onTracking={saveTracking} invoiceWA={invoiceWA} trackingWA={trackingWA} onDelete={async()=>{if(!confirm(`Delete ${o.invoiceNo||o.orderNo}?`))return;if(o.invoiceGenerated){alert('Completed orders cannot be deleted directly because stock / credit has already moved. Use a reversal or adjustment instead.');return;}await save({...data,orders:data.orders.filter(x=>x.orderNo!==o.orderNo)})}}/>)}{!filteredOrders.length&&<Empty text="No orders found"/>}</div></div>}
    {tab==='inventory'&&<div><div className="mb-5"><div className="text-[9px] tracking-[.2em] opacity-40">STOCK CONTROL</div><h1 className="serif text-3xl">Inventory</h1></div><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">{data.products.map(p=><div key={p.id} className="bg-white rounded-[20px] border p-4"><div className="text-[9px] opacity-40">{p.productId}</div><div className="font-medium">{p.name}</div><div className="text-3xl font-semibold mt-4">{p.stock||0}</div><div className="text-[9px] opacity-40">CURRENT STOCK</div><div className="flex gap-2 mt-4"><button onClick={()=>stockIn(p)} className="flex-1 h-9 rounded-full bg-black text-white text-[10px]">+ STOCK IN</button><button onClick={()=>adjustStock(p)} className="flex-1 h-9 rounded-full border text-[10px]">ADJUST</button></div></div>)}</div><div className="bg-white rounded-[22px] border mt-6 overflow-hidden"><div className="p-5 font-semibold">Stock Movement</div><div className="overflow-x-auto"><table className="w-full text-[11px]"><thead className="bg-[#f4f1eb] text-left"><tr><th className="p-3">DATE</th><th className="p-3">TYPE</th><th className="p-3">PRODUCT</th><th className="p-3">QTY</th><th className="p-3">REFERENCE</th><th className="p-3">NOTE</th></tr></thead><tbody>{data.stockMovements.map(x=><tr key={x.id} className="border-t"><td className="p-3 whitespace-nowrap">{String(x.date||'').slice(0,10)}</td><td className="p-3"><Pill>{x.type}</Pill></td><td className="p-3">{x.pid} · {x.productName}</td><td className={`p-3 font-semibold ${Number(x.qty)<0?'text-red-600':'text-green-700'}`}>{Number(x.qty)>0?'+':''}{x.qty}</td><td className="p-3">{x.reference||'-'}</td><td className="p-3">{x.customerName||x.note||'-'}</td></tr>)}{!data.stockMovements.length&&<tr><td colSpan="6"><Empty text="No stock movements yet"/></td></tr>}</tbody></table></div></div></div>}
    {tab==='invoices'&&<div><div className="mb-5"><div className="text-[9px] tracking-[.2em] opacity-40">DOCUMENTS</div><h1 className="serif text-3xl">Invoices</h1></div><div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{completed.map(o=><div key={o.orderNo} className="bg-white rounded-[20px] border p-4"><div className="flex justify-between"><div><div className="font-semibold">{o.invoiceNo}</div><div className="text-[10px] opacity-45">{o.invoiceDate}</div></div><Pill>{o.status}</Pill></div><div className="mt-4"><div className="text-[12px]">{o.memberName}</div><div className="text-[10px] opacity-45">{o.contact}</div></div><div className="text-2xl font-semibold mt-4">{money(o.totalAmount)}</div><div className="flex gap-2 mt-4"><button onClick={()=>setInvoice(o)} className="flex-1 h-9 rounded-full bg-black text-white text-[10px]">VIEW / PRINT</button><a href={invoiceWA(o)} target="_blank" className="flex-1 h-9 rounded-full bg-[#25D366] text-white text-[10px] grid place-items-center">WHATSAPP</a></div></div>)}</div></div>}
    {tab==='products'&&<div className="grid lg:grid-cols-[360px_1fr] gap-5"><div className="bg-white rounded-[22px] border p-5 h-fit"><div className="serif text-xl">{editingProduct?'Edit Product':'+ New Product'}</div><div className="space-y-3 mt-4"><Field label="Product ID *" value={productForm.productId} onChange={e=>setProductForm({...productForm,productId:e.target.value})}/><Field label="Product Name *" value={productForm.name} onChange={e=>setProductForm({...productForm,name:e.target.value})}/><div className="grid grid-cols-2 gap-2"><Field type="number" label="Regular Price" value={productForm.regularPrice} onChange={e=>setProductForm({...productForm,regularPrice:Number(e.target.value)})}/><Field type="number" label="Professional Price" value={productForm.memberPrice} onChange={e=>setProductForm({...productForm,memberPrice:Number(e.target.value)})}/></div><Field type="number" label="Opening Stock" value={productForm.stock} onChange={e=>setProductForm({...productForm,stock:Number(e.target.value)})}/><TextArea label="Description" value={productForm.description} onChange={e=>setProductForm({...productForm,description:e.target.value})}/><label className="block text-[11px]">Product Photo<input type="file" accept="image/*" className="block mt-2 text-[11px]" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>setProductForm({...productForm,photo:r.result});r.readAsDataURL(f)}}/></label>{productForm.photo&&<img src={productForm.photo} className="w-full h-36 object-cover rounded-xl"/>}<label className="flex gap-2 text-[11px]"><input type="checkbox" checked={productForm.visible!==false} onChange={e=>setProductForm({...productForm,visible:e.target.checked})}/> Show on public catalogue</label><button onClick={saveProduct} className="w-full h-11 rounded-xl bg-black text-white text-[11px]">SAVE PRODUCT</button>{editingProduct&&<button onClick={()=>{setEditingProduct(null);setProductForm({productId:'',name:'',regularPrice:0,memberPrice:0,stock:0,description:'',photo:'',visible:true})}} className="w-full h-10 rounded-xl border text-[11px]">CANCEL</button>}</div></div><div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">{data.products.map(p=><div key={p.id} className="bg-white rounded-[20px] border overflow-hidden"><div className="h-36 bg-[#ebe7df]">{p.photo?<img src={p.photo} className="w-full h-full object-cover"/>:<div className="h-full grid place-items-center opacity-20">NO PHOTO</div>}</div><div className="p-4"><div className="text-[9px] opacity-40">{p.productId}</div><div className="font-medium text-[13px]">{p.name}</div><div className="flex justify-between mt-3 text-[11px]"><span>{money(p.memberPrice)}</span><span>Stock {p.stock||0}</span></div><div className="flex gap-2 mt-4"><button onClick={()=>startProductEdit(p)} className="flex-1 h-9 rounded-full bg-black text-white text-[10px]">EDIT</button><button onClick={async()=>{if(!confirm(`Delete ${p.productId} ${p.name}?`))return;const used=data.orders.some(o=>(o.items||[]).some(i=>i.productId===p.id));if(used){alert('This product has order history. Hide it instead of deleting it.');return;}await save({...data,products:data.products.filter(x=>x.id!==p.id)})}} className="px-3 h-9 rounded-full bg-red-50 text-red-600 text-[10px]">DELETE</button></div></div></div>)}</div></div>}
    {tab==='settings'&&<div className="max-w-[760px]"><div className="mb-5"><div className="text-[9px] tracking-[.2em] opacity-40">SYSTEM</div><h1 className="serif text-3xl">Settings</h1></div><div className="bg-white rounded-[22px] border p-5 grid md:grid-cols-2 gap-3">{[['companyName','Company Name'],['brandName','Brand Name'],['phone','Phone'],['email','Email'],['bankName','Bank Name'],['bankNo','Bank Account No.'],['tngName','TNG Name'],['tngNo','TNG Number'],['salesPerson','Default Sales Person']].map(([k,l])=><Field key={k} label={l} value={data.settings[k]||''} onChange={e=>setDataSetting(k,e.target.value,data,save)}/>)}<div className="md:col-span-2"><TextArea label="Business Address" value={data.settings.address||''} onChange={e=>setDataSetting('address',e.target.value,data,save)}/></div><div className="md:col-span-2 text-[10px] opacity-45">Changes save directly to Neon.</div></div></div>}
   </main>
  </div>}
  {customerView&&<Modal onClose={()=>setCustomerView(null)} wide><div className="p-6"><div className="flex justify-between gap-4"><div><div className="serif text-2xl">{customerView.name}</div><div className="text-[11px] opacity-50">{customerView.phone} · Credit {money(customers.find(x=>x.id===customerView.id)?.credit)}</div></div><button onClick={()=>setCustomerView(null)} className="h-9 px-4 rounded-full border text-[10px]">CLOSE</button></div><div className="grid md:grid-cols-2 gap-5 mt-6"><div><div className="font-semibold mb-3">Order History</div><div className="space-y-2">{customerOrders(customerView).map(o=><div key={o.orderNo} className="p-3 rounded-xl bg-[#f4f1eb]"><div className="flex justify-between"><div><div className="text-[11px] font-medium">{o.invoiceNo||o.orderNo}</div><div className="text-[9px] opacity-45">{o.invoiceDate||o.date}</div></div><b className="text-[11px]">{money(o.totalAmount)}</b></div></div>)}{!customerOrders(customerView).length&&<Empty text="No order history"/>}</div></div><div><div className="font-semibold mb-3">Credit Ledger</div><div className="space-y-2">{customerCredits(customerView).map(x=><div key={x.id} className="p-3 rounded-xl bg-[#f4f1eb]"><div className="flex justify-between"><div><div className="text-[11px]">{x.note}</div><div className="text-[9px] opacity-45">{String(x.date).slice(0,10)} · {money(x.before)} → {money(x.after)}</div></div><b className={`text-[11px] ${Number(x.amount)<0?'text-red-600':'text-green-700'}`}>{Number(x.amount)>0?'+':''}{money(x.amount)}</b></div></div>)}{!customerCredits(customerView).length&&<Empty text="No credit movements yet"/>}</div></div></div></div></Modal>}
  {invoice&&<InvoiceModal o={invoice} settings={data.settings} onClose={()=>setInvoice(null)} wa={invoiceWA(invoice)}/>} {receipt&&<Modal onClose={()=>setReceipt(null)}><img src={receipt} className="w-full"/></Modal>}
 </div>
}
function setDataSetting(k,v,data,save){save({...data,settings:{...data.settings,[k]:v}})}
function Stat({label,value}){return <div className="bg-white rounded-[20px] border p-4"><div className="text-[9px] tracking-[.12em] opacity-40">{label}</div><div className="text-2xl md:text-3xl font-semibold mt-2">{value}</div></div>}
function Empty({text}){return <div className="py-10 text-center text-[11px] opacity-30">{text}</div>}
function OrderCard({o,onInvoice,onComplete,onTracking,invoiceWA,trackingWA,onDelete}){const [tn,setTn]=useState(o.trackingNo||'');return <div className="bg-white rounded-[20px] border p-4"><div className="flex flex-wrap justify-between gap-4"><div><div className="flex gap-2 items-center"><b className="text-[13px]">{o.invoiceNo||o.orderNo}</b><Pill>{o.status}</Pill></div><div className="text-[12px] mt-1">{o.memberName} · {o.contact}</div><div className="text-[10px] opacity-45 mt-1">{o.paymentMethod} · {o.invoiceDate||o.date}</div><div className="mt-3 space-y-1">{(o.items||[]).map((i,n)=><div key={n} className="text-[10px] opacity-60">{i.pid} {i.productName} × {i.qty} · {money(i.total||Number(i.qty)*Number(i.price))}</div>)}</div>{o.paymentMethod==='Member Credit'&&o.invoiceGenerated&&<div className="text-[10px] mt-3 p-2 bg-[#f4f1eb] rounded-lg">Credit {money(o.creditBefore)} → Used {money(o.creditUsed)} → Balance {money(o.creditBalanceAfter)}</div>}</div><div className="min-w-[260px] text-right"><div className="text-2xl font-semibold">{money(o.totalAmount)}</div><div className="flex flex-wrap justify-end gap-1.5 mt-3">{!o.invoiceGenerated&&<button onClick={onComplete} className="px-3 h-8 rounded-full bg-black text-white text-[9px]">COMPLETE + INVOICE</button>}{o.invoiceGenerated&&<><button onClick={onInvoice} className="px-3 h-8 rounded-full bg-black text-white text-[9px]">INVOICE</button><a href={invoiceWA(o)} target="_blank" className="px-3 h-8 rounded-full bg-[#25D366] text-white text-[9px] grid place-items-center">WHATSAPP INVOICE</a></>}<button onClick={onDelete} className="px-3 h-8 rounded-full border text-red-600 text-[9px]">DELETE</button></div>{o.invoiceGenerated&&<div className="flex gap-1.5 mt-3"><input value={tn} onChange={e=>setTn(e.target.value)} placeholder="Tracking No." className="h-9 px-3 rounded-full border text-[10px] flex-1"/><button onClick={()=>onTracking(o,tn)} className="h-9 px-3 rounded-full bg-[#e9e3d9] text-[9px]">SAVE</button>{tn&&<a href={trackingWA({...o,trackingNo:tn})} target="_blank" className="h-9 px-3 rounded-full bg-black text-white text-[9px] grid place-items-center">WHATSAPP</a>}</div>}</div></div></div>}
function InvoiceModal({o,settings,onClose,wa}){return <Modal onClose={onClose} wide><div className="no-print p-4 border-b flex justify-between"><button onClick={onClose} className="px-4 h-9 rounded-full border text-[10px]">CLOSE</button><div className="flex gap-2"><a href={wa} target="_blank" className="px-4 h-9 rounded-full bg-[#25D366] text-white text-[10px] grid place-items-center">WHATSAPP</a><button onClick={()=>window.print()} className="px-4 h-9 rounded-full bg-black text-white text-[10px]">PRINT / SAVE PDF</button></div></div><div id="invoice-print-area" className="p-7 md:p-10 bg-white"><div className="flex justify-between gap-6 border-b-2 border-black pb-6"><div>{window.INVOICE_LOGO&&<img src={window.INVOICE_LOGO} className="w-[190px] max-w-full h-auto object-contain mb-4"/>}<div className="font-bold text-[15px]">{settings.companyName}</div><div className="text-[10px] max-w-[420px] mt-1 leading-4">{settings.address}<br/>{settings.phone}</div></div><div className="text-right"><div className="serif text-4xl">INVOICE</div><div className="text-[11px] mt-2"><b>{o.invoiceNo}</b><br/>{o.invoiceDate}</div></div></div><div className="grid grid-cols-2 gap-8 py-6 text-[11px]"><div><div className="text-[9px] opacity-45 mb-1">BILL TO</div><b>{o.memberName}</b><br/>{o.contact}<br/><span className="leading-5">{o.address}</span></div><div className="text-right"><div><span className="opacity-45">Sales Person:</span> {o.salesPerson||'-'}</div><div><span className="opacity-45">Payment:</span> {o.paymentMethod}</div></div></div><table className="w-full text-[11px]"><thead><tr className="border-y-2 border-black text-left"><th className="py-3">PRODUCT ID</th><th>DESCRIPTION</th><th className="text-right">QTY</th><th className="text-right">PRICE</th><th className="text-right">TOTAL</th></tr></thead><tbody>{(o.items||[]).map((i,n)=><tr key={n} className="border-b"><td className="py-3">{i.pid}</td><td>{i.productName}</td><td className="text-right">{i.qty}</td><td className="text-right">{money(i.price)}</td><td className="text-right">{money(i.total||Number(i.qty)*Number(i.price))}</td></tr>)}</tbody></table><div className="ml-auto mt-5 w-full max-w-[320px] text-[11px] space-y-2"><div className="flex justify-between"><span>Subtotal</span><b>{money(o.subtotal)}</b></div>{o.paymentMethod==='Member Credit'&&<><div className="flex justify-between"><span>Credit Before</span><span>{money(o.creditBefore)}</span></div><div className="flex justify-between"><span>Credit Used</span><span>-{money(o.creditUsed)}</span></div><div className="flex justify-between"><span>Credit Balance After</span><span>{money(o.creditBalanceAfter)}</span></div></>}<div className="flex justify-between border-t-2 border-black pt-3 text-[15px]"><b>Total Amount</b><b>{money(o.totalAmount)}</b></div></div>{o.remarks&&<div className="mt-8 text-[10px]"><b>Remarks:</b> {o.remarks}</div>}<div className="mt-10 text-center text-[9px] tracking-[.08em]">GOODS SOLD ARE NEITHER RETURNABLE NOR REFUNDABLE</div><div className="grid grid-cols-2 gap-16 mt-14 text-[9px]"><div className="border-t pt-2">RECEIVED BY</div><div className="border-t pt-2">ISSUED BY</div></div></div></Modal>}
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
</script>

</body></html>
