<script type="text/babel">
const {useState,useEffect}=React;
const STORAGE_KEY='musco_store';
const ADMIN_CRED={user:'admin',pass:'Musco2026!'};

{id:'p1',productId:'MUS-GLUE-01',name:'Mus & Co. 速干美睫胶水 0.5秒',photo:window.HERO_IMG,regularPrice:128,memberPrice:98,stock:56,description:'专为高级美睫师设计，低刺激',visible:true},
{id:'p2',productId:'MUS-PRM-02',name:'Mus & Co. 加固底液 Primer',photo:'',regularPrice:68,memberPrice:48,stock:120,description:'提升附着力',visible:true},
{id:'p3',productId:'MUS-REM-03',name:'Mus & Co. 温和卸睫膏',photo:'',regularPrice:58,memberPrice:38,stock:80,description:'奶油质地不熏眼',visible:true},
{id:'p4',productId:'MUS-TWEEZ-04',name:'Mus & Co. 金标镊子',photo:'',regularPrice:88,memberPrice:68,stock:34,description:'日本钢材',visible:true},
];
const DEFAULT_STORE={products:DEFAULT_PRODUCTS,members:[{id:'m1',name:'Shon Goh',phone:'012-3456789',email:'shon@demo.com',password:'123456',credit:500},{id:'m2',name:'Belle Yeap',phone:'012-9876543',email:'belle@demo.com',password:'123456',credit:300}],orders:[],settings:{bankName:'BEYOUTIFUL STUDIO',bankNo:'1234 5678 9012 (Maybank)',tngName:'Beyoutiful Studio',tngNo:'012-3456789',salesPerson:'Mus & Co.'}};
function useStore(){
  const [data,setData]=useState(()=>{try{const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw);}catch{} return DEFAULT_STORE;});
  const save=async(next)=>{setData(next); localStorage.setItem(STORAGE_KEY,JSON.stringify(next)); try{await fetch('/api/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'main',data:next})});}catch{}};
  useEffect(()=>{(async()=>{try{const r=await fetch('/api/store'); if(r.ok){const j=await r.json(); if(j?.data?.products) setData(j.data);}}catch{}})();},[]);
  return {data,save};
}
function App(){
  const {data,save}=useStore();
  const [cart,setCart]=useState([]); const [showCart,setShowCart]=useState(false); const [showMemberModal,setShowMemberModal]=useState(false);
  const [showAdminLogin,setShowAdminLogin]=useState(false); const [showAdminPanel,setShowAdminPanel]=useState(false); const [adminTab,setAdminTab]=useState('products');
  const [memberForm,setMemberForm]=useState({mode:'login',name:'',phone:'',email:'',password:'',credit:0,error:''});
  const [currentMember,setCurrentMember]=useState(()=>{try{const m=localStorage.getItem('musco_current_member'); return m?JSON.parse(m):null;}catch{return null;}});
  const [adminCred,setAdminCred]=useState({u:'',p:''}); const [isAdmin,setIsAdmin]=useState(false);
  const [editingProduct,setEditingProduct]=useState(null); const [newProduct,setNewProduct]=useState({id:'',productId:'',name:'',photo:'',regularPrice:0,memberPrice:0,stock:0,description:'',visible:true});
  const [paymentMethod,setPaymentMethod]=useState('Member Credit'); const [paymentProof,setPaymentProof]=useState(''); const [invoiceOrder,setInvoiceOrder]=useState(null);
  const [receiptView,setReceiptView]=useState(''); const [trackingInputs,setTrackingInputs]=useState({}); const [invoiceDateEdit,setInvoiceDateEdit]=useState('');
  const addToCart=(pid)=>{setCart(prev=>{const ex=prev.find(c=>c.productId===pid); if(ex) return prev.map(c=>c.productId===pid?{...c,qty:c.qty+1}:c); return [...prev,{productId:pid,qty:1}];}); setShowCart(true);};
  const cartTotal=cart.reduce((sum,c)=>{const p=data.products.find(pp=>pp.id===c.productId); if(!p) return sum; const price=currentMember?p.memberPrice:p.regularPrice; return sum+price*c.qty;},0);
  const handleCheckout=async()=>{if(cart.length===0) return; if(paymentMethod==='Member Credit' && !currentMember){alert('请先登录会员'); setShowMemberModal(true); return;} if(paymentMethod==='Member Credit' && currentMember && currentMember.credit < cartTotal){alert('余额不足'); return;} const now=new Date(); const ymd=now.toISOString().slice(0,10).replace(/-/g,''); const count=data.orders.filter(o=>o.invoiceNo.includes(ymd)).length+1; const invoiceNo=`INV-${ymd}-${String(count).padStart(3,'0')}`; const isoDate=now.toISOString().slice(0,10); const items=cart.map(c=>{const p=data.products.find(pp=>pp.id===c.productId); const price=currentMember?p.memberPrice:p.regularPrice; return {productId:c.productId,pid:p.productId,productName:p.name,qty:c.qty,price,total:price*c.qty};}); const subtotal=items.reduce((s,i)=>s+i.total,0); const creditUsed=paymentMethod==='Member Credit'?subtotal:0; const order={invoiceNo,date:isoDate,invoiceDate:isoDate,memberId:currentMember?.id||null,memberName:currentMember?.name||'Guest',contact:currentMember?.phone||'-',items,subtotal,creditUsed,totalAmount:subtotal,paymentMethod,paymentProof,status:'Processing',trackingNo:'',salesPerson:data.settings.salesPerson,remarks:''}; const newProducts=data.products.map(p=>{const ci=cart.find(c=>c.productId===p.id); if(ci) return {...p,stock:Math.max(0,p.stock-ci.qty)}; return p;}); let newMembers=data.members; if(paymentMethod==='Member Credit' && currentMember){newMembers=data.members.map(m=>m.id===currentMember.id?{...m,credit:m.credit-subtotal}:m); const updated=newMembers.find(m=>m.id===currentMember.id); setCurrentMember(updated); localStorage.setItem('musco_current_member',JSON.stringify(updated));} const nextData={...data,products:newProducts,members:newMembers,orders:[order,...data.orders]}; await save(nextData); setCart([]); setPaymentProof(''); setShowCart(false); setInvoiceOrder(order);};
  const handleFileToBase64=(file,cb)=>{const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file);};
  const waInvoice=(o)=>{const txt=`Mus & Co. INVOICE\nInvoice No.: ${o.invoiceNo}\nDate: ${o.invoiceDate}\nCustomer: ${o.memberName}\n\n${o.items.map(i=>`• ${i.productName} x${i.qty} = RM${i.total}`).join('\n')}\nSubtotal: RM${o.subtotal}\nCredit Used: RM${o.creditUsed}\nTotal: RM${o.totalAmount}\nPayment: ${o.paymentMethod}`; return `https://wa.me/?text=${encodeURIComponent(txt)}`;};

  return (
    <div className="min-h-screen bg-[#f5f0e8] text-[#1a1a1a]">

      <header className="sticky top-0 z-30 bg-[#0a0a0a] border-b border-white/10"><div className="max-w-[1280px] mx-auto px-5 h-[64px] flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-9 h-9 rounded-full bg-[#f5f0e8] flex items-center justify-center serif font-bold">M</div><span className="serif text-[#f5f0e8] text-[20px]">Mus & Co.</span></div><div className="flex gap-2"><button onClick={()=>document.getElementById('shop')?.scrollIntoView({behavior:'smooth'})} className="px-5 py-2 rounded-full bg-[#f5f0e8] text-black text-[12px] font-semibold">SHOP</button><button onClick={()=>setShowMemberModal(true)} className="hidden md:block px-5 py-2 rounded-full border border-white/30 text-white text-[12px]">{currentMember?`${currentMember.name} RM${currentMember.credit}`:'MEMBER LOGIN'}</button><button onClick={()=>setShowAdminLogin(true)} className="px-4 py-2 rounded-full bg-white/10 text-white text-[11px] border border-white/20">ADMIN</button><button onClick={()=>setShowCart(true)} className="px-4 py-2 rounded-full bg-white text-black text-[12px] font-semibold">CART {cart.length>0 && cart.reduce((s,c)=>s+c.qty,0)}</button></div></div></header>
      <section className="bg-[#0a0a0a]"><div className="max-w-[1280px] mx-auto px-5 py-10 md:py-16 grid md:grid-cols-[1.2fr_0.8fr] gap-8 items-center"><div><h1 className="serif text-[#f5f0e8] text-[40px] md:text-[64px] leading-[0.95]">Mus & Co.<br/><span className="text-[#c9a86a]">专业美业用品</span><br/><span className="text-[28px] opacity-80">自产自销</span></h1><p className="mt-6 text-white/70 text-[14px]">由 Beyoutiful Studio 自主研发与供应<br/>专注美睫师专业胶水</p><div className="mt-8 flex gap-3"><button onClick={()=>document.getElementById('shop')?.scrollIntoView({behavior:'smooth'})} className="px-7 py-3 rounded-full bg-[#f5f0e8] text-black text-[13px]">立即选购 →</button><button onClick={()=>setShowMemberModal(true)} className="px-7 py-3 rounded-full border border-white/20 text-white text-[13px]">会员登录</button></div></div><div className="rounded-[28px] bg-[#f5f0e8] p-3"><img src={window.HERO_IMG} className="w-full h-[460px] object-cover rounded-[20px]" /></div></div></section>
      <section id="shop" className="max-w-[1280px] mx-auto px-5 py-12"><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">{data.products.filter(p=>p.visible).map(p=>{const showMember=!!currentMember; return (<div key={p.id} className="bg-white rounded-[20px] overflow-hidden border"><div className="h-[240px] bg-[#f5f0e8] relative">{p.photo?<img src={p.photo} className="w-full h-full object-cover"/>:<div className="grid place-items-center h-full text-[11px]">NO IMAGE {p.productId}</div>}<div className="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black text-white text-[10px]">{p.productId}</div><div className="absolute top-3 right-3 px-2 py-1 rounded-full bg-emerald-500 text-white text-[10px]">库存 {p.stock}</div></div><div className="p-4"><div className="serif text-[15px]">{p.name}</div><div className="text-[12px] text-black/50 h-[34px]">{p.description}</div><div className="mt-3"><span className="line-through text-black/40 text-[13px]">RM{p.regularPrice}</span><span className="ml-2 text-[18px] font-semibold text-[#8b5a3c]">RM{showMember?p.memberPrice:p.regularPrice}</span></div><button onClick={()=>addToCart(p.id)} className="mt-4 w-full h-[40px] rounded-full bg-black text-white text-[12px]">ADD TO CART</button></div></div>);})}</div></section>
      {showCart && <div className="fixed inset-0 z-50 flex justify-end"><div className="absolute inset-0 bg-black/40" onClick={()=>setShowCart(false)}></div><div className="relative w-full max-w-[420px] bg-[#fcfaf6] h-full flex flex-col"><div className="p-6 border-b flex justify-between"><div className="serif">购物车 ({cart.reduce((s,c)=>s+c.qty,0)})</div><button onClick={()=>setShowCart(false)}>✕</button></div><div className="flex-1 overflow-auto p-5 space-y-3">{cart.map(c=>{const p=data.products.find(pp=>pp.id===c.productId); const price=currentMember?p.memberPrice:p.regularPrice; return (<div key={c.productId} className="flex gap-3 bg-white rounded-xl p-3 border"><div className="w-16 h-16 bg-[#f5f0e8] rounded-xl overflow-hidden">{p.photo?<img src={p.photo} className="w-full h-full object-cover"/>:null}</div><div className="flex-1"><div className="text-[12px]">{p.name}</div><div className="text-[11px] opacity-50">RM{price} x {c.qty}</div><div className="flex gap-2 mt-2"><button onClick={()=>setCart(prev=>prev.map(x=>x.productId===c.productId?{...x,qty:Math.max(1,x.qty-1)}:x))} className="w-6 h-6 rounded-full border">-</button><span>{c.qty}</span><button onClick={()=>setCart(prev=>prev.map(x=>x.productId===c.productId?{...x,qty:x.qty+1}:x))} className="w-6 h-6 rounded-full border">+</button><button onClick={()=>setCart(prev=>prev.filter(x=>x.productId!==c.productId))} className="ml-auto text-[11px] text-red-500">移除</button></div></div></div>);})}</div><div className="p-6 bg-white border-t space-y-3"><div className="flex justify-between text-[13px]"><span>Subtotal</span><span>RM{cartTotal}</span></div><div className="text-[11px] font-semibold">CHECKOUT PAYMENT</div>{['Member Credit','Bank Transfer','TNG / Online Payment'].map(m=>(<label key={m} className={`flex gap-3 p-3 rounded-xl border cursor-pointer ${paymentMethod===m?'bg-black text-white':'bg-[#f5f0e8]'}`}><input type="radio" checked={paymentMethod===m} onChange={()=>setPaymentMethod(m)}/><span className="text-[12px]">{m}{m==='Member Credit'&&currentMember?` (RM${currentMember.credit})`:''}</span></label>))}{(paymentMethod==='Bank Transfer'||paymentMethod==='TNG / Online Payment') && <div className="bg-[#f5f0e8] rounded-xl p-3 text-[12px]"><div>Bank: {data.settings.bankName} {data.settings.bankNo}</div><div>TNG: {data.settings.tngName} {data.settings.tngNo}</div><div className="mt-2">Upload Proof<input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0]; if(f){const r=new FileReader(); r.onload=()=>setPaymentProof(r.result); r.readAsDataURL(f);}}} className="w-full text-[11px]"/>{paymentProof && <img src={paymentProof} className="mt-2 h-20 object-cover rounded"/>}</div></div>}<button onClick={handleCheckout} className="w-full h-12 rounded-full bg-black text-white text-[13px]">确认下单 · 自动生成 Invoice</button></div></div></div>}
      {showMemberModal && <div className="fixed inset-0 z-[70] grid place-items-center p-4"><div className="absolute inset-0 bg-black/50" onClick={()=>setShowMemberModal(false)}></div><div className="relative w-full max-w-[420px] bg-[#fcfaf6] rounded-[24px] p-7"><div className="flex justify-between mb-6"><div className="serif text-[20px]">{memberForm.mode==='login'?'Member Login':'Create Account'}</div><button onClick={()=>setShowMemberModal(false)}>✕</button></div>{currentMember ? <div><div className="bg-black text-white rounded-2xl p-5"><div className="serif text-[20px]">{currentMember.name}</div><div className="text-[12px] opacity-70">{currentMember.email}</div><div className="mt-2">Credit RM{currentMember.credit}</div></div><button onClick={()=>{setCurrentMember(null); localStorage.removeItem('musco_current_member'); setShowMemberModal(false);}} className="w-full mt-4 h-11 rounded-full border">LOGOUT</button></div> : <><div className="flex gap-2 mb-4"><button onClick={()=>setMemberForm({...memberForm,mode:'login',error:''})} className={`flex-1 h-9 rounded-full ${memberForm.mode==='login'?'bg-black text-white':'bg-black/5'}`}>登录</button><button onClick={()=>setMemberForm({...memberForm,mode:'create',error:''})} className={`flex-1 h-9 rounded-full ${memberForm.mode==='create'?'bg-black text-white':'bg-black/5'}`}>注册</button></div><div className="grid grid-cols-2 gap-2 mb-3"><button onClick={()=>setMemberForm({...memberForm,email:'shon@demo.com',password:'123456',mode:'login'})} className="p-2 rounded-xl bg-white border text-[11px] text-left"><b>shon@demo.com</b><br/>123456 RM500</button><button onClick={()=>setMemberForm({...memberForm,email:'belle@demo.com',password:'123456',mode:'login'})} className="p-2 rounded-xl bg-white border text-[11px] text-left"><b>belle@demo.com</b><br/>123456 RM300</button></div><div className="space-y-3">{memberForm.mode==='create' && <><input value={memberForm.name} onChange={e=>setMemberForm({...memberForm,name:e.target.value})} placeholder="Name" className="w-full h-11 px-4 rounded-full border bg-white"/><input value={memberForm.phone} onChange={e=>setMemberForm({...memberForm,phone:e.target.value})} placeholder="Phone" className="w-full h-11 px-4 rounded-full border bg-white"/></>}<input value={memberForm.email} onChange={e=>setMemberForm({...memberForm,email:e.target.value})} placeholder="Email" className="w-full h-11 px-4 rounded-full border bg-white"/><input type="password" value={memberForm.password} onChange={e=>setMemberForm({...memberForm,password:e.target.value})} placeholder="Password" className="w-full h-11 px-4 rounded-full border bg-white"/>{memberForm.mode==='create' && <input type="number" value={memberForm.credit} onChange={e=>setMemberForm({...memberForm,credit:Number(e.target.value)})} placeholder="Credit" className="w-full h-11 px-4 rounded-full border bg-white"/>}{memberForm.error && <div className="text-red-500 text-[11px]">{memberForm.error}</div>}<button onClick={()=>{if(memberForm.mode==='create'){if(!memberForm.name||!memberForm.email||!memberForm.password){setMemberForm({...memberForm,error:'请填写完整'}); return;} const nm={id:'m'+Date.now(),name:memberForm.name,phone:memberForm.phone,email:memberForm.email.toLowerCase().trim(),password:memberForm.password,credit:memberForm.credit||0}; const next={...data,members:[...data.members,nm]}; save(next); setCurrentMember(nm); localStorage.setItem('musco_current_member',JSON.stringify(nm)); setShowMemberModal(false);}else{const email=memberForm.email.toLowerCase().trim(); const pass=memberForm.password.trim(); const found=data.members.find(m=>(m.email.toLowerCase()===email||m.phone===memberForm.email.trim())&&m.password===pass); if(!found){setMemberForm({...memberForm,error:'账号或密码错误，点上方测试账号'}); return;} setCurrentMember(found); localStorage.setItem('musco_current_member',JSON.stringify(found)); setShowMemberModal(false);}}} className="w-full h-11 rounded-full bg-black text-white">LOGIN / CREATE</button></div></>}</div></div>}

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
