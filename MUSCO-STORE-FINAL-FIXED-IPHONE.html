  const save=async(next)=>{
    setData(next);
    try{
      const localSafe=JSON.parse(JSON.stringify(next,(key,value)=>{
        if(key==='paymentProof' && typeof value==='string' && value.startsWith('data:')) return '';
        if(key==='photo' && typeof value==='string' && value.startsWith('data:')) return '';
        return value;
      }));
      localStorage.setItem(STORAGE_KEY,JSON.stringify(localSafe));
    }catch(e){
      try{localStorage.removeItem(STORAGE_KEY);}catch{}
    }
    const r=await fetch('/api/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'main',data:next})});
    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      throw new Error(j.error||'Cloud save failed');
    }
  };
  useEffect(()=>{(async()=>{try{const r=await fetch('/api/store'); if(r.ok){const j=await r.json(); if(j?.data?.products) setData(j.data);}}catch{}})();},[]);
  return {data,save};

      {creditTarget && <div className="fixed inset-0 z-[88] grid place-items-center p-4"><div className="absolute inset-0 bg-black/60" onClick={()=>setCreditTarget(null)}></div><div className="relative w-full max-w-[420px] bg-[#fcfaf6] rounded-[24px] p-6"><div className="flex justify-between mb-5"><div><div className="text-[10px] opacity-50 tracking-widest">MEMBER CREDIT</div><div className="serif text-[22px]">{creditTarget.__remove?'REMOVE CREDIT':'ADD CREDIT'}</div></div><button onClick={()=>setCreditTarget(null)}>✕</button></div><div className="bg-black text-white rounded-2xl p-4 mb-4"><div className="font-semibold">{creditTarget.name}</div><div className="text-[11px] opacity-60">{creditTarget.phone}</div><div className="mt-2 text-[18px]">Current Balance RM{Number(creditTarget.credit||0).toFixed(2)}</div></div><div className="space-y-3"><input type="number" min="0.01" step="0.01" value={creditAmount} onChange={e=>setCreditAmount(e.target.value)} placeholder="Credit Amount (RM)" className="w-full h-11 px-4 rounded-full border bg-white"/><input type="date" value={creditExpiry} onChange={e=>setCreditExpiry(e.target.value)} className="w-full h-11 px-4 rounded-full border bg-white"/><input value={creditNote} onChange={e=>setCreditNote(e.target.value)} placeholder="Note (optional)" className="w-full h-11 px-4 rounded-full border bg-white"/><div className="flex gap-2 pt-2"><button onClick={()=>setCreditTarget(null)} className="flex-1 h-11 rounded-full border">CANCEL</button><button onClick={async()=>{const amt=Number(creditAmount);if(!amt||amt<=0){alert('请输入 Credit 金额');return;}if(creditTarget.__remove&&amt>Number(creditTarget.credit||0)){alert('移除金额不能超过当前 Credit Balance RM'+Number(creditTarget.credit||0).toFixed(2));return;}const delta=creditTarget.__remove?-amt:amt;const c={id:'C'+Date.now(),memberId:creditTarget.id,date:new Date().toISOString(),type:creditTarget.__remove?'Admin Credit Removal':'Admin Credit',amount:delta,expiry:creditTarget.__remove?null:(creditExpiry?new Date(creditExpiry+'T23:59:59').toISOString():null),note:creditNote.trim()||(creditTarget.__remove?'Removed by admin':'Added by admin')};try{const r=await fetch('/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'credit',credit:c})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'Credit save failed');}const updated={...creditTarget,credit:Math.max(0,Number(creditTarget.credit||0)+delta)};const nextMembers=data.members.map(x=>x.id===updated.id?updated:x);await save({...data,members:nextMembers});if(currentMember?.id===updated.id){setCurrentMember(updated);localStorage.setItem('musco_current_member',JSON.stringify(updated));}setCreditTarget(null);alert(creditTarget.__remove?'Credit removed successfully.':'Credit added successfully.');}catch(err){alert(err.message||'Credit save failed');}}} className="flex-1 h-11 rounded-full bg-black text-white">{creditTarget.__remove?'REMOVE CREDIT':'ADD CREDIT'}</button></div></div></div></div>}
      {invoiceOrder && <div className="fixed inset-0 z-[90] bg-[#f5f0e8] overflow-auto"><div className="sticky top-0 bg-black text-white px-6 h-[56px] flex justify-between items-center"><span>INVOICE {invoiceOrder.invoiceNo}</span><div className="flex gap-2"><button onClick={()=>window.print()} className="px-4 py-1.5 rounded-full bg-white text-black text-[11px] font-semibold no-print">PRINT / SAVE PDF</button><a href={waInvoice(invoiceOrder)} target="_blank" className="px-4 py-1.5 rounded-full bg-[#25D366] text-white text-[11px] no-print">WHATSAPP INVOICE</a><button onClick={()=>setInvoiceOrder(null)} className="px-4 py-1.5 rounded-full bg-white/10 text-[11px]">关闭</button></div></div><div className="max-w-[900px] mx-auto p-6 bg-white m-6 rounded-2xl border"><div className="flex justify-between"><div><img src={data.settings.logo||window.HERO_IMG} className="h-14 w-14 object-contain rounded-xl border mb-2"/><div className="font-semibold text-[16px]">{data.settings.companyName}</div><div className="text-[11px] opacity-60 max-w-[420px]">{data.settings.address}</div><div className="text-[11px] opacity-60">{data.settings.phone}</div></div><div className="text-right"><div className="text-[12px] font-semibold">{invoiceOrder.invoiceNo}</div><div className="flex items-center gap-2 mt-2"><span className="text-[11px]">Invoice Date</span><input type="date" value={invoiceDateEdit||invoiceOrder.invoiceDate} onChange={e=>setInvoiceDateEdit(e.target.value)} className="h-7 px-2 border rounded text-[12px]"/><button onClick={async()=>{const nd=invoiceDateEdit||invoiceOrder.invoiceDate; const upd={...invoiceOrder,invoiceDate:nd,date:nd}; setInvoiceOrder(upd); const nextOrders=data.orders.map(o=>o.invoiceNo===invoiceOrder.invoiceNo?upd:o); await save({...data,orders:nextOrders}); setInvoiceDateEdit(''); alert('日期已更新');}} className="px-3 py-1 rounded-full bg-black text-white text-[11px]">SAVE DATE</button></div></div></div><div className="grid md:grid-cols-2 gap-6 mt-6 text-[13px]"><div><div className="text-[11px] opacity-50">Bill To</div><div className="font-semibold">{invoiceOrder.memberName}</div><div>Contact: {invoiceOrder.contact}</div><div>Address: {invoiceOrder.address||'-'}</div><div>Sales: {invoiceOrder.salesPerson}</div></div><div><div className="text-[11px] opacity-50">Payment</div><div>{invoiceOrder.paymentMethod}</div><div>Shipping: {invoiceOrder.shippingMethod||'-'} · RM{Number(invoiceOrder.shippingFee||0).toFixed(2)}</div><div>Tracking: {invoiceOrder.trackingNo||'-'}</div></div></div><table className="w-full mt-6 text-[12px] border rounded-xl overflow-hidden"><thead className="bg-black text-white text-[11px]"><tr><th className="p-3 text-left">Product ID</th><th className="p-3 text-left">Description</th><th className="p-3 text-center">Qty</th><th className="p-3 text-right">Price</th><th className="p-3 text-right">Total</th></tr></thead><tbody>{invoiceOrder.items.map((it,i)=>(<tr key={i} className="border-b"><td className="p-3">{it.pid}</td><td className="p-3">{it.productName}</td><td className="p-3 text-center">{it.qty}</td><td className="p-3 text-right">RM{it.price}</td><td className="p-3 text-right">RM{it.total}</td></tr>))}</tbody></table><div className="mt-4 flex gap-2 no-print"><button onClick={()=>window.print()} className="px-6 py-2 rounded-full bg-black text-white text-[12px]">🖨️ PRINT / SAVE PDF 打印 / 存PDF</button><span className="text-[11px] opacity-50 self-center">→ 选择 Save as PDF 即可存成 PDF 文件</span></div><div className="mt-6 grid md:grid-cols-[1fr_280px] gap-6"><div><div className="border rounded-xl p-3 text-[12px]">Thank you!</div><div className="mt-3 bg-[#f5f0e8] rounded-xl p-3 text-[11px]"><b>GOODS SOLD ARE NEITHER RETURNABLE NOR REFUNDABLE</b></div><div className="grid grid-cols-2 gap-8 pt-8"><div className="border-t pt-2 text-[11px] opacity-50">RECEIVED BY</div><div className="border-t pt-2 text-[11px] opacity-50">ISSUED BY {invoiceOrder.salesPerson}</div></div></div><div className="bg-black text-white rounded-xl p-5 text-[13px] space-y-2"><div className="flex justify-between"><span className="opacity-60">Subtotal</span><span>RM{Number(invoiceOrder.subtotal||0).toFixed(2)}</span></div><div className="flex justify-between"><span className="opacity-60">Shipping</span><span>{invoiceOrder.shippingMethod||'-'} · RM{Number(invoiceOrder.shippingFee||0).toFixed(2)}</span></div><div className="flex justify-between"><span className="opacity-60">Credit Before</span><span>RM{Number(invoiceOrder.creditBefore||0).toFixed(2)}</span></div><div className="flex justify-between"><span className="opacity-60">Credit Used</span><span className="text-[#c9a86a]">-RM{Number(invoiceOrder.creditUsed||0).toFixed(2)}</span></div><div className="flex justify-between"><span className="opacity-60">Credit Balance After</span><span>RM{Number(invoiceOrder.creditBalanceAfter||0).toFixed(2)}</span></div><div className="flex justify-between font-bold text-[16px] border-t border-white/10 pt-3"><span>Total</span><span>RM{Number(invoiceOrder.totalAmount||0).toFixed(2)}</span></div></div></div></div></div>}
      {receiptView && <div className="fixed inset-0 z-[95] grid place-items-center p-4"><div className="absolute inset-0 bg-black/60" onClick={()=>setReceiptView('')}></div><div className="relative bg-white rounded-2xl p-4 max-w-[520px] w-full"><div className="flex justify-between mb-3"><span className="text-[12px] font-semibold">VIEW RECEIPT</span><button onClick={()=>setReceiptView('')}>✕</button></div><img src={receiptView} className="w-full rounded-xl border"/></div></div>}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App/>);
</script>
</body></html>
